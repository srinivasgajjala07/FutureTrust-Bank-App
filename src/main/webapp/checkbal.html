<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Balance - ABC Bank</title>
    <style>
        /* General Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5; /* Light background */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Disable scrolling */
        }
        /* Header */
        header {
            background-color: #00509e; /* Deep Blue */
            color: white;
            padding: 15px 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed; /* Fixed header */
            top: 0;
            left: 0;
            z-index: 10;
        }
        header .title {
            font-size: 20px;
            font-weight: bold;
        }
        header .home-btn {
            padding: 10px 20px;
            background-color: #003366; /* Dark Blue */
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin-right:30px;
        }
        header .home-btn:hover {
            background-color: #002244; /* Darker Blue on hover */
        }
        header .home-btn:active {
            background-color: #001122; /* Darkest Blue when clicked */
        }
        /* Footer */
        footer {
            background-color: #333; /* Dark gray */
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            position: fixed; /* Fixed footer */
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }
        /* Form Container */
        .form-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: auto;
        }
        /* Header */
        h1 {
            color: #00509e; /* Deep Blue */
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        /* Form Inputs */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            color: #333;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #00509e; /* Blue */
            background-color: #e6f7ff; /* Light blue background */
            outline: none;
        }
        /* Submit Button */
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #00509e; /* Deep Blue */
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #003366; /* Darker blue on hover */
        }
        input[type="submit"]:active {
            background-color: #001d3d; /* Darkest blue when clicked */
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="title">ABC Bank</div>
        <a href="home.html" class="home-btn">Home</a>
    </header>

    <!-- Form Container -->
    <div class="form-container">
        <h1>Check Your Account Balance</h1>
        <form action="checkbal" method="post">
            <label for="accno">Account Number:</label><br>
            <input type="text" name="accno" id="accno" placeholder="Enter your account number" required><br>

            <label for="pword">Password:</label><br>
            <input type="password" name="pword" id="pword" placeholder="Enter your password" required><br>
            <input type="submit" value="Check Balance">
        </form>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2024 ABC Bank. All rights reserved.
    </footer>
</body>
</html>
