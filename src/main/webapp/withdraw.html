<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Withdrawal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header styling */
    header {
      background-color: #003366;
      color: #ffffff;
      padding: 15px 20px;
    }

    header .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: auto;
    }

    header .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ff6347;
      text-decoration: none;
    }

    header .nav-links {
      display: flex;
      gap: 15px;
    }

    header .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.3s;
      padding: 8px 15px;
      border-radius: 5px;
    }

    header .nav-links a:hover {
      background-color: #ff6347;
      color: #003366;
    }

    /* Main content styling */
    .container {
      background: linear-gradient(135deg, #ffffff, #f7f8fa);
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      margin: 30px auto;
    }

    .container h2 {
      font-size: 24px;
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      font-weight: bold;
      color: #555;
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9fafb;
      color: #333;
      transition: all 0.3s;
    }

    .form-group input:focus {
      border-color: #ff6347;
      outline: none;
      box-shadow: 0px 0px 8px rgba(255, 99, 71, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #ff6347;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      text-transform: uppercase;
    }

    .btn-submit:hover {
      background-color: #e55347;
    }

    .info {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }

    .info a {
      color: #ff6347;
      text-decoration: none;
    }

    /* Footer styling */
    footer {
      background-color: #003366;
      color: #ffffff;
      text-align: center;
      padding: 10px 0;
      margin-top: auto;
    }

    footer p {
      margin: 5px 0;
      font-size: 14px;
    }

    footer a {
      color: #ff6347;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- Header section -->
  <header>
    <div class="nav-bar">
      <a href="#" class="logo">BankApp</a>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="/deposit">Deposit</a>
        <a href="/withdraw">Withdraw</a>
        <a href="/contact">Contact</a>
      </div>
    </div>
  </header>

  <!-- Main content with withdrawal form -->
  <div class="container">
    <h2>Withdraw Funds</h2>
    <form action="withdraw">
      <div class="form-group">
        <label for="account-number">Account Number</label>
        <input type="text" id="account-number" name="accountNumber" required placeholder="Enter your account number">
      </div>
      <div class="form-group">
        <label for="amount">Withdrawal Amount</label>
        <input type="number" id="amount" name="amount" min="1" step="0.01" required placeholder="Enter amount to withdraw">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn-submit">Withdraw Now</button>
    </form>
    <p class="info">Need help? <a href="/contact-support">Contact Support</a></p>
  </div>

  <!-- Footer section -->
  <footer>
    <p>&copy; 2024 BankApp. All rights reserved.</p>
    <p><a href="/privacy-policy">Privacy Policy</a> | <a href="/terms-of-service">Terms of Service</a></p>
  </footer>
</body>
</html>
