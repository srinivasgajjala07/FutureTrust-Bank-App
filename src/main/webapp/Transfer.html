<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Fund Transfer</title>
<style>
    /* Basic reset and styling */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    
    /* General body styling */
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #f1f5f9;
        color: #333;
    }

    /* Header styling */
    .header {
        background-color: #004080;
        padding: 15px;
        text-align: center;
        color: #fff;
        position: relative;
    }
    
    .header h1 {
        font-size: 1.5rem;
        margin: 0;
    }
    
    .header p {
        margin: 5px 0;
        font-size: 0.9rem;
    }

    /* Home button styling */
    .home-button {
        position: absolute;
        top: 15px;
        right: 20px;
        background-color: #ffffff;
        color: #004080;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .home-button:hover {
        background-color: #e0e0e0;
    }

    /* Centering form container */
    .main-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    /* Styling the form container */
    .transfer-form-container {
        background-color: #fff;
        width: 100%;
        max-width: 450px;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
    }

    /* Form title */
    .transfer-form-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #004080;
    }

    /* Form fields */
    .transfer-form-container label {
        font-weight: bold;
        color: #004080;
        margin-bottom: 5px;
        display: inline-block;
    }

    .transfer-form-container input[type="text"],
    .transfer-form-container input[type="password"] {
        width: 100%;
        padding: 12px;
        margin: 8px 0 20px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        transition: border-color 0.3s ease;
    }

    .transfer-form-container input[type="text"]:focus,
    .transfer-form-container input[type="password"]:focus {
        border-color: #0073e6;
        outline: none;
    }

    /* Transfer button */
    .transfer-form-container input[type="submit"] {
        width: 100%;
        padding: 12px;
        border: none;
        background-color: #004080;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .transfer-form-container input[type="submit"]:hover {
        background-color: #003366;
    }

    /* Small note for security */
    .note {
        text-align: center;
        font-size: 0.9em;
        color: #666;
        margin-top: 10px;
    }

    /* Footer styling */
    .footer {
        background-color: #004080;
        text-align: center;
        color: #fff;
        padding: 10px;
        font-size: 0.85rem;
    }
</style>
</head>
<body>
   <!-- Header with Home button -->
   <div class="header">
       <h1>XYZ Bank</h1>
       <p>Your trusted partner in secure banking</p>
       <a href="home.html" class="home-button">Home</a>
   </div>
   
   <!-- Main content area with the transfer form -->
   <div class="main-content">
       <div class="transfer-form-container">
           <h2>Transfer Funds</h2>
           <form action="transfer" method="post">
               <label for="haccno">Enter Home Account Number:</label>
               <input type="text" id="haccno" name="haccno" required>

               <label for="raccno">Receiver's Account Number:</label>
               <input type="text" id="raccno" name="raccno" required>

               <label for="amt">Amount:</label>
               <input type="text" id="amt" name="amt" required>

               <label for="pword">Password:</label>
               <input type="password" id="pword" name="pword" required>

               <input type="submit" value="Transfer">
           </form>
           <p class="note">Ensure account details are accurate before submitting.</p>
       </div>
   </div>

   <!-- Footer -->
   <div class="footer">
       <p>Need help? Call us at 1-800-XYZ-BANK or visit our help center.</p>
       <p>&copy; 2024 XYZ Bank. All rights reserved.</p>
   </div>
</body>
</html>
