<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Account - FutureTrust Bank</title>

<style>

/* Reset */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

/* Body */

body{
background:#f5f5f5;
color:#333;
display:flex;
flex-direction:column;
min-height:100vh;
}

/* Header */

.header{
background:#004d99;
color:white;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
font-size:22px;
}

.header a{
color:white;
text-decoration:none;
font-weight:bold;
}

.header a:hover{
text-decoration:underline;
}

/* Main container */

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px 20px;
}

/* Form container */

.container{
max-width:600px;
width:100%;
background:linear-gradient(0deg,#ffffff 0%,#f4f7fb 100%);
padding:30px 40px;
border-radius:30px;
box-shadow:rgba(133,189,215,0.5) 0px 20px 30px -15px;
}

/* Form Section */

.form-container{
text-align:center;
}

.form-container h3{
font-size:28px;
margin-bottom:8px;
}

.form-container p{
color:#666;
margin-bottom:20px;
}

/* Form */

.form{
display:flex;
flex-direction:column;
}

.form input,
.form textarea{

width:100%;
padding:12px 15px;
margin-bottom:12px;

border-radius:12px;
border:1px solid #ccc;

font-size:15px;
}

.form input:focus,
.form textarea:focus{
outline:none;
border-color:#12B1D1;
}

.form textarea{
resize:none;
height:90px;
}

/* Button */

.submit-btn{

background:#005a87;
color:white;

padding:12px;
border:none;

border-radius:6px;
font-size:16px;
cursor:pointer;

transition:0.3s;
}

.submit-btn:hover{
background:#003f5d;
}

/* Error */

.error{
color:red;
font-size:14px;
margin-bottom:10px;
}

/* Footer */

.footer{
background:#333;
color:white;
text-align:center;
padding:12px;
font-size:14px;
}

</style>

<script>

function validateForm(){

var password=document.getElementById("password").value;
var repassword=document.getElementById("repassword").value;

if(password!==repassword){

document.getElementById("error-message").innerText="Passwords do not match!";
return false;

}

document.getElementById("error-message").innerText="";
return true;

}

</script>

</head>

<body>

<!-- HEADER -->

<header class="header">
<h2>FutureTrust Bank</h2>
<a href="home.html">Home</a>
</header>

<!-- MAIN CONTENT -->

<div class="main">

<div class="container">

<section id="new-account" class="form-container">

<h3>Create New Account</h3>
<p>Open a new account with our simple process.</p>

<form action="NewAccountServlet" method="POST" class="form" onsubmit="return validateForm()">

<input type="text" name="name" required placeholder="Enter your full name">

<input type="email" name="email" required placeholder="Enter your email address">

<input type="text" name="phone" required placeholder="Enter your phone number">

<textarea name="address" required placeholder="Enter your address"></textarea>

<input type="number" name="deposit" min="1" required placeholder="Enter initial deposit amount">

<input type="password" id="password" name="password" required placeholder="Enter your password">

<input type="password" id="repassword" name="repassword" required placeholder="Re-enter your password">

<div id="error-message" class="error"></div>

<button type="submit" class="submit-btn">Create Account</button>

</form>

</section>

</div>

</div>

<!-- FOOTER -->

<footer class="footer">
<p>© 2026 FutureTrust Bank. All Rights Reserved.</p>
</footer>

</body>
</html>
